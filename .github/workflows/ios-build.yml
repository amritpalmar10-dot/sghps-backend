name: iOS Build
run-name: iOS Build ${{ inputs.build_id || github.ref_name }}

on:
  push:
    tags:
      - 'ios-build/*'
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build (empty builds this branch)'
        required: false
        type: string
        default: ''
      ios_path:
        description: 'Path to iOS project (e.g., "ios" for React Native)'
        required: false
        type: string
        default: '.'
      scheme:
        description: 'Xcode scheme to build (auto-detected if empty)'
        required: false
        type: string
        default: ''
      use_signing:
        description: 'Enable code signing (requires secrets to be configured)'
        required: false
        type: boolean
        default: false
      configuration:
        description: 'Build configuration (Debug is faster, Release for production)'
        required: false
        type: string
        default: 'Debug'
      flutter_version:
        description: 'Flutter version to use (e.g., 3.24.0). Empty means latest stable.'
        required: false
        type: string
        default: ''
      jdk_version:
        description: 'JDK version for Kotlin Multiplatform Gradle builds (e.g., 17).'
        required: false
        type: string
        default: '17'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot
          echo "Building $(git rev-parse --short HEAD)"

      - name: Resolve parameters
        id: params
        env:
          IN_BUILD_ID: ${{ inputs.build_id }}
          IN_IOS_PATH: ${{ inputs.ios_path }}
          IN_SCHEME: ${{ inputs.scheme }}
          IN_USE_SIGNING: ${{ inputs.use_signing }}
          IN_CONFIGURATION: ${{ inputs.configuration }}
          IN_FLUTTER_VERSION: ${{ inputs.flutter_version }}
          IN_JDK_VERSION: ${{ inputs.jdk_version }}
        run: |
          set -e
          param() {
            local v=""
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              v="$2"
            elif [ -f builder.json ]; then
              v=$(jq -r "$3 // empty" builder.json)
            fi
            v="${v:-$4}"
            echo "$1=$v" >> "$GITHUB_OUTPUT"
            echo "$1=$v"
          }
          param build_id         "$IN_BUILD_ID" '""' "${GITHUB_REF_NAME##*/}"
          param ios_path         "$IN_IOS_PATH" '.ios.path' '.'
          param scheme           "$IN_SCHEME" '.ios.scheme' ''
          param use_signing      "$IN_USE_SIGNING" '.ios.signing' 'false'
          param configuration    "$IN_CONFIGURATION" '.ios.configuration' 'Debug'
          param flutter_version  "$IN_FLUTTER_VERSION" '.flutter.version' ''
          param jdk_version      "$IN_JDK_VERSION" '.kmp.jdkVersion' '17'

      - name: Compute project root
        id: root
        env:
          IOS_PATH: ${{ steps.params.outputs.ios_path }}
        run: |
          set -e
          if [ "$IOS_PATH" = "." ] || [ "$IOS_PATH" = "./" ]; then
            PROJECT_ROOT="."
          else
            PROJECT_ROOT=$(dirname "$IOS_PATH" | sed 's|/ios$||')
          fi
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_ROOT"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v6
        id: cache-deriveddata
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}
          restore-keys: |
            deriveddata-

      - name: Detect project type
        id: detect
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -e
          if [ -f "${PROJECT_ROOT}/pubspec.yaml" ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
          elif [ -f "${PROJECT_ROOT}/package.json" ] && grep -q '"expo"' "${PROJECT_ROOT}/package.json"; then
            echo "type=expo" >> $GITHUB_OUTPUT
          elif [ -f "${PROJECT_ROOT}/package.json" ] && grep -q '"react-native"' "${PROJECT_ROOT}/package.json"; then
            echo "type=reactnative" >> $GITHUB_OUTPUT
          elif grep -rqlE 'kotlin\("multiplatform"\)|org\.jetbrains\.kotlin\.multiplatform' --include='*.gradle.kts' --include='*.gradle' "${PROJECT_ROOT}" 2>/dev/null; then
            echo "type=kmp" >> $GITHUB_OUTPUT
          else
            echo "type=native" >> $GITHUB_OUTPUT
          fi
          echo "Detected type: $(cat $GITHUB_OUTPUT | tail -1)"

      - name: Materialize missing xcconfig files
        run: |
          set -e
          find . -path ./DerivedData -prune -o -type f \
            \( -name '*.xcconfig.template' -o -name '*.xcconfig.example' \
               -o -name '*.xcconfig.sample' -o -name '*.template.xcconfig' \
               -o -name '*.example.xcconfig' -o -name '*.sample.xcconfig' \) -print \
          | while IFS= read -r template; do
              case "$template" in
                *.xcconfig.template|*.xcconfig.example|*.xcconfig.sample) target="${template%.*}" ;;
                *) target="$(dirname "$template")/$(basename "$template" | sed -E 's/\.(template|example|sample)\.xcconfig$/.xcconfig/')" ;;
              esac
              if [ ! -f "$target" ]; then
                cp "$template" "$target"
                echo "::warning::$target was missing (gitignored?); copied $template over it."
              fi
            done

      - name: Generate Xcode project (XcodeGen)
        env:
          IOS_PATH: ${{ steps.params.outputs.ios_path }}
        run: |
          set -e
          cd "$IOS_PATH"
          MANIFEST=""
          for f in project.yml project.yaml; do
            if [ -f "$f" ] && grep -qE '^targets:' "$f"; then
              MANIFEST="$f"
              break
            fi
          done
          if [ -z "$MANIFEST" ]; then
            echo "No XcodeGen manifest — skipping."
          elif [ -n "$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)" ]; then
            echo "Found a committed .xcodeproj — skipping generation."
          else
            echo "Found $MANIFEST and no .xcodeproj — generating with XcodeGen."
            brew install xcodegen
            xcodegen generate
          fi

      - name: Check base configuration files
        env:
          IOS_PATH: ${{ steps.params.outputs.ios_path }}
        run: |
          set -e
          MISSING=""
          for pbx in $(find "$IOS_PATH" -maxdepth 2 -name project.pbxproj -not -path '*/Pods.xcodeproj/*'); do
            for id in $(grep -o 'baseConfigurationReference = [A-Za-z0-9]*' "$pbx" | awk '{print $3}' | sort -u); do
              ref=$(grep -m1 "^[[:space:]]*$id .*isa = PBXFileReference" "$pbx" || true)
              name=$(printf '%s' "$ref" | sed -n 's/.*[ \t]path = "\{0,1\}\([^";]*\)"\{0,1\};.*/\1/p')
              [ -n "$name" ] || continue
              base=$(basename "$name")
              case "$name" in *Pods/*|*"Target Support Files"*) continue ;; esac
              case "$base" in Pods-*|Generated.xcconfig) continue ;; esac
              if [ -z "$(find . -name "$base" -print -quit)" ]; then
                MISSING="$MISSING $base"
              fi
            done
          done
          if [ -n "$MISSING" ]; then
            echo "::error::The project has base configuration files that are not in the repository:$MISSING."
            exit 1
          fi

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.params.outputs.flutter_version || '' }}
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/$PROJECT_ROOT"
          flutter pub get

      - name: Disable Swift Package Manager
        if: steps.detect.outputs.type == 'flutter'
        env:
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/$PROJECT_ROOT"
          flutter config --no-enable-swift-package-manager || true

      - name: Flutter pod install
        if: steps.detect.outputs.type == 'flutter'
        env:
          IOS_PATH: ${{ steps.params.outputs.ios_path }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/$IOS_PATH"
          flutter precache --ios
          pod install --repo-update
          rm -rf Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage 2>/dev/null || true

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Restore node_modules cache
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install npm dependencies
        if: (steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo') && steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Setup JDK
        if: steps.detect.outputs.type == 'kmp'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.params.outputs.jdk_version || '17' }}

      - name: Setup Gradle
        if: steps.detect.outputs.type == 'kmp'
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Pods cache
        uses: actions/cache@v6
        id: pods-cache
        with:
          path: |
            ${{ steps.params.outputs.ios_path }}/Pods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles(format('{0}/Podfile.lock', steps.params.outputs.ios_path)) }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install certificate and provisioning profile
        if: steps.params.outputs.use_signing == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -e
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PLIST=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(plutil -extract UUID raw -o - "$PROFILE_PLIST")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST")
          PROFILE_NAME=$(plutil -extract Name raw -o - "$PROFILE_PLIST")
          APP_ID=$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID=${APP_ID#"$TEAM_ID".}
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Build IPA
        env:
          BUILD_ID: ${{ steps.params.outputs.build_id }}
          IOS_PATH: ${{ steps.params.outputs.ios_path }}
          PROJECT_ROOT: ${{ steps.root.outputs.project_root }}
          SCHEME: ${{ steps.params.outputs.scheme }}
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
          USE_SIGNING: ${{ steps.params.outputs.use_signing }}
          CONFIGURATION: ${{ steps.params.outputs.configuration }}
        run: |
          set -e
          cd "$IOS_PATH"
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
          if [ -f "Podfile" ]; then
            echo "Running pod install..."
            pod install
            WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          fi
          if [ -z "$SCHEME" ] && [ "$PROJECT_TYPE" = "native" ]; then
            if [ -n "$WORKSPACE" ]; then
              TARGET_FLAG=-workspace
              TARGET_PATH=$WORKSPACE
              BASE=$(basename "$WORKSPACE" .xcworkspace)
            else
              TARGET_FLAG=-project
              TARGET_PATH=$PROJECT
              BASE=$(basename "$PROJECT" .xcodeproj)
            fi
            SCHEMES=$(xcodebuild "$TARGET_FLAG" "$TARGET_PATH" -list -json 2>/dev/null | jq -r '(.workspace // .project).schemes[]?' || true)
            echo "Schemes:"
            printf '%s\n' "$SCHEMES" | sed 's/^/  /'
            SCHEME=$(printf '%s\n' "$SCHEMES" | grep -Fx "$BASE" | head -1 || true)
            if [ -z "$SCHEME" ]; then
              SCHEME=$(printf '%s\n' "$SCHEMES" | grep -v '^Pods-' | head -1 || true)
            fi
          fi
          DERIVED_DATA_PATH="${GITHUB_WORKSPACE}/DerivedData"
          if [ "$PROJECT_TYPE" = "flutter" ]; then
            cd "$GITHUB_WORKSPACE/$PROJECT_ROOT"
            if [ "$CONFIGURATION" = "Debug" ]; then
              echo "Building Flutter iOS Debug..."
              flutter build ios --debug --no-codesign
            else
              echo "Building Flutter iOS Release..."
              flutter build ios --release --no-codesign
            fi
            cd "$GITHUB_WORKSPACE/$IOS_PATH"
            if [ "$USE_SIGNING" = "true" ]; then
              ARCHIVE_CMD="xcodebuild"
              if [ -n "$WORKSPACE" ]; then
                ARCHIVE_CMD="$ARCHIVE_CMD -workspace '$WORKSPACE'"
              elif [ -n "$PROJECT" ]; then
                ARCHIVE_CMD="$ARCHIVE_CMD -project '$PROJECT'"
              fi
              ARCHIVE_CMD="$ARCHIVE_CMD -scheme '${SCHEME:-Runner}'"
              ARCHIVE_CMD="$ARCHIVE_CMD -configuration '$CONFIGURATION'"
              ARCHIVE_CMD="$ARCHIVE_CMD -destination 'generic/platform=iOS'"
              ARCHIVE_CMD="$ARCHIVE_CMD -derivedDataPath '$DERIVED_DATA_PATH'"
              ARCHIVE_CMD="$ARCHIVE_CMD DEVELOPMENT_TEAM='$DEVELOPMENT_TEAM'"
              ARCHIVE_CMD="$ARCHIVE_CMD CODE_SIGN_STYLE=Manual"
              ARCHIVE_CMD="$ARCHIVE_CMD PROVISIONING_PROFILE_SPECIFIER='$PROVISIONING_PROFILE_NAME'"
              ARCHIVE_CMD="$ARCHIVE_CMD -archivePath '$GITHUB_WORKSPACE/build/App.xcarchive' archive"
              eval $ARCHIVE_CMD
            fi
          else
            BUILD_CMD="xcodebuild"
            if [ -n "$WORKSPACE" ]; then
              BUILD_CMD="$BUILD_CMD -workspace $WORKSPACE"
            elif [ -n "$PROJECT" ]; then
              BUILD_CMD="$BUILD_CMD -project $PROJECT"
            fi
            if [ -z "$SCHEME" ]; then
              if [ -n "$WORKSPACE" ]; then
                SCHEME=$(basename "$WORKSPACE" .xcworkspace)
              elif [ -n "$PROJECT" ]; then
                SCHEME=$(basename "$PROJECT" .xcodeproj)
              fi
            fi
            BUILD_CMD="$BUILD_CMD -scheme '$SCHEME'"
            BUILD_CMD="$BUILD_CMD -configuration '$CONFIGURATION'"
            BUILD_CMD="$BUILD_CMD -destination 'generic/platform=iOS'"
            BUILD_CMD="$BUILD_CMD -derivedDataPath '$DERIVED_DATA_PATH'"
            if [ "$USE_SIGNING" = "true" ]; then
              BUILD_CMD="$BUILD_CMD DEVELOPMENT_TEAM='$DEVELOPMENT_TEAM'"
              BUILD_CMD="$BUILD_CMD CODE_SIGN_STYLE=Manual"
              BUILD_CMD="$BUILD_CMD PROVISIONING_PROFILE_SPECIFIER='$PROVISIONING_PROFILE_NAME'"
              BUILD_CMD="$BUILD_CMD -archivePath '$GITHUB_WORKSPACE/build/App.xcarchive' archive"
            else
              BUILD_CMD="$BUILD_CMD CODE_SIGNING_ALLOWED=NO build"
            fi
            eval $BUILD_CMD
          fi
          if [ "$USE_SIGNING" = "true" ]; then
            cd "$GITHUB_WORKSPACE"
            APP_BUNDLE_ID=$(plutil -extract ApplicationProperties.CFBundleIdentifier raw -o - build/App.xcarchive/Info.plist)
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '    <key>method</key>' \
              '    <string>development</string>' \
              '    <key>signingStyle</key>' \
              '    <string>manual</string>' \
              '    <key>teamID</key>' \
              "    <string>${DEVELOPMENT_TEAM}</string>" \
              '    <key>provisioningProfiles</key>' \
              '    <dict>' \
              "        <key>${APP_BUNDLE_ID}</key>" \
              "        <string>${PROVISIONING_PROFILE_NAME}</string>" \
              '    </dict>' \
              '</dict>' \
              '</plist>' > ExportOptions.plist
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/export
            mv build/export/*.ipa "build/$BUILD_ID.ipa"
          else
            if [ "$PROJECT_TYPE" = "flutter" ]; then
              APP_PATH=$(find "${GITHUB_WORKSPACE}/${PROJECT_ROOT}/build/ios/iphoneos" -name "*.app" -type d | head -1)
            else
              if [ -n "$WORKSPACE" ]; then
                TARGET_FLAG=-workspace
                TARGET_PATH=$WORKSPACE
              else
                TARGET_FLAG=-project
                TARGET_PATH=$PROJECT
              fi
              APP_PATH=$(xcodebuild "$TARGET_FLAG" "$TARGET_PATH" \
                -scheme "$SCHEME" \
                -configuration "$CONFIGURATION" \
                -destination 'generic/platform=iOS' \
                -derivedDataPath "$DERIVED_DATA_PATH" \
                -showBuildSettings -json 2>/dev/null \
                | jq -r 'map(.buildSettings)
                         | map(select(.PRODUCT_TYPE == "com.apple.product-type.application"
                                      and (.TARGET_BUILD_DIR | contains("-iphoneos"))))
                         | map(.TARGET_BUILD_DIR + "/" + .FULL_PRODUCT_NAME)
                         | first // empty' || true)
            fi
            if [ -z "$APP_PATH" ]; then
              echo "Error: Could not find .app"
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            cd build
            zip -rq "$BUILD_ID.ipa" Payload
            rm -rf Payload
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: build/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Check for DerivedData
        id: dd
        if: always()
        run: |
          if [ -d DerivedData ]; then echo "exists=yes" >> $GITHUB_OUTPUT; fi

      - name: Save DerivedData cache
        uses: actions/cache/save@v6
        if: always() && steps.dd.outputs.exists == 'yes'
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}

      - name: Cleanup signing
        if: always() && steps.params.outputs.use_signing == 'true'
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Build summary
        if: always()
        env:
          USE_SIGNING: ${{ steps.params.outputs.use_signing }}
          CONFIGURATION: ${{ steps.params.outputs.configuration }}
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** ${{ steps.params.outputs.build_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration:** $CONFIGURATION" >> $GITHUB_STEP_SUMMARY
          if [ "$USE_SIGNING" = "true" ]; then
            echo "- **Signing:** Signed (development)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Signing:** Unsigned" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Delete trigger tag
        if: always() && github.ref_type == 'tag'
        run: git push origin ":refs/tags/$GITHUB_REF_NAME"